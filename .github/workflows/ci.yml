name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        # Every step runs inside the flake dev shell, so all tooling (Node, pnpm
        # via corepack, web-ext, Playwright browsers, xvfb) is pinned by the flake
        # — no `pnpm dlx` or ad-hoc tool fetches in CI.
        shell: nix develop --command bash -eo pipefail {0}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      # Runs `wxt prepare` via the postinstall hook.
      - run: pnpm install --frozen-lockfile

      # Typecheck, formatting, + unit tests (pure logic + DOM transforms against real fixtures).
      - run: pnpm check:types
      - run: pnpm check:formatting
      - run: pnpm test:unit

      # Build all targets. `pnpm build` covers chrome + firefox + safari; the
      # Safari step emits only the unsigned MV2 payload (Xcode conversion/signing
      # is a documented manual step on macOS, not run here).
      - run: pnpm build

      # Static validation of the Firefox build (web-ext is provided by the flake).
      - run: pnpm check:lint

      # Distributable zips (chrome + firefox + safari zips, plus firefox sources zip).
      - run: pnpm zip

      # E2E: load the built Chromium extension and drive it against the captured
      # fixtures. Browsers come from the flake (PLAYWRIGHT_BROWSERS_PATH); run
      # headed under xvfb so the extension actually loads.
      - run: xvfb-run -a pnpm test:e2e

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: extension-builds
          path: apps/extension/.output/*.zip
          # .output is a dotted dir; without this, upload-artifact's default
          # hidden-file exclusion silently drops the zips.
          include-hidden-files: true
          if-no-files-found: warn

  deploy-website:
    # Self-contained static site (apps/website) → GitHub Pages, on main only.
    # Pages' Actions deployment can publish any subfolder — no top-level docs/ needed.
    needs: build-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: apps/website
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
