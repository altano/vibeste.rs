name: release

# release-please watches `main` and keeps an open "Release PR" that bumps
# apps/extension/package.json (the version WXT bakes into every manifest) and
# maintains apps/extension/CHANGELOG.md from Conventional Commits. Merging that
# PR tags `vX.Y.Z` and cuts a GitHub Release — which, in this same run, triggers
# the build job that attaches the extension zips. Normal pushes to main only
# refresh the Release PR.
#
# Store submission is NOT automated. Uploading the zips to the Chrome Web Store /
# Firefox AMO is a documented manual step — see README "Releasing".

on:
  push:
    branches: [main]

jobs:
  # 1. Maintain the Release PR; on its merge, create the tag + GitHub Release.
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # 2. Build every target and attach the zips to the GitHub Release. These are
  #    the artifacts people install from (Edge side-load, Safari build) and that
  #    you upload to the stores by hand.
  build:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        # Same pinned flake dev shell as ci.yml — Node, pnpm, web-ext all pinned.
        shell: nix develop --command bash -eo pipefail {0}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - run: pnpm install --frozen-lockfile

      # Build all targets, then the full guard rail before publishing artifacts.
      # main is protected + CI-required so this is already green, but re-running
      # here means a broken build never gets published. `check` = types +
      # formatting + lint; `test` = unit + e2e (e2e is headed, so under xvfb).
      - run: pnpm build
      - run: pnpm check
      - run: xvfb-run -a pnpm test
      - run: pnpm zip

      # Attach the built zips to the Release release-please just created.
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: apps/extension/.output/*.zip
          fail_on_unmatched_files: true
